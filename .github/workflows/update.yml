name: カードデータの更新

on:
  schedule:
    - cron: "0 18 * * 0" # 月曜 3:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: uv run tools/build_cards.py
      - run: uv run tools/build_art.py
        env:
          YGO_ART_PASSPHRASE: ${{ secrets.YGO_ART_PASSPHRASE }}
      - run: uv run tools/build_texts.py
        env:
          YGO_ART_PASSPHRASE: ${{ secrets.YGO_ART_PASSPHRASE }}
      # Wiki の書き方が変わって失敗しても、ほかの更新は止めない（前の data/prerelease.json が残る）
      - run: uv run tools/build_prerelease.py
        continue-on-error: true
      - name: 変化があればコミット
        run: |
          git add data art
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "カードデータの定期更新"
          git push
